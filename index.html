<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worktree Manager</title>
    <script>
      // Resolve the theme before first paint. Without this, the window flashes light
      // while the app boots and asks Rust for the stored preference — which on a dark
      // desktop is a visible, ugly blink on every launch.
      (() => {
        try {
          const stored = localStorage.getItem('wtm.theme') ?? 'system';
          const dark =
            stored === 'dark' ||
            (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themeChoice = stored;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }

        // Window chrome differs by platform and the difference is visible on the very
        // first frame, so it is resolved here rather than after the bundle boots. The
        // global is injected by the `wtm-platform` Tauri plugin, which runs before this
        // script does.
        //
        // The `? 'linux' : 'macos'` direction is load-bearing: anything not recognisably
        // Linux — an absent global under a plain `bun run dev` in a browser, a value from
        // a future platform — must render the macOS layout rather than a third one
        // nobody has looked at.
        document.documentElement.dataset.platform =
          window.__WTM_PLATFORM__ === 'linux' ? 'linux' : 'macos';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
