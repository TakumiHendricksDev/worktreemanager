schema = 1
api = 1
id = "example.project-tools"
name = "Project Tools"
version = "0.1.0"
description = "A Git status command and a self-contained project panel."

[[commands]]
id = "status"
title = "Show worktree status"
command = ["git", "status", "--short"]

[[terminals]]
id = "git-log"
title = "Git history terminal"
command = ["git", "log", "--oneline", "--decorate", "-30"]

[[views]]
id = "summary"
title = "Project summary"
file = "summary.html"
slots = ["sidebar", "home", "code"]

[[panels]]
id = "notes"
title = "Scratch panel"
file = "panel.html"

[[palettes]]
id = "quiet"
title = "Quiet tools"
hue = 250
chroma = 0.33
brand = ["#e2e8ec", "#c3ced6", "#3a454e", "#262e35"]
