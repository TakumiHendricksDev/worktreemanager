<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Custom session workbench</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: var(--wtm-bg);
        color: var(--wtm-fg);
        font: 15px var(--wtm-font-ui, system-ui);
      }
      button,
      input {
        font: inherit;
        padding: 9px;
        border: 1px solid var(--wtm-border);
        border-radius: 6px;
        color: inherit;
        background: var(--wtm-bg-elevated);
      }
      pre {
        white-space: pre-wrap;
        border-block: 1px solid var(--wtm-border);
        padding-block: 20px;
        min-height: 160px;
      }
      p {
        color: var(--wtm-fg-muted);
      }
    </style>
  </head>
  <body>
    <h1>A workbench owned by a plugin</h1>
    <p>
      This example replaces the entire region with its own UI and durable echo backend. It
      is not an AI agent or SSH connection.
    </p>
    <button id="attach">Attach to the demo session</button
    ><button id="control" disabled>Request input control</button
    ><button id="detach" disabled>Detach</button
    ><button id="settings">Plugin settings</button>
    <pre id="transcript"></pre>
    <form id="input">
      <input id="message" aria-label="Message" disabled /><button id="send" disabled>
        Send
      </button>
    </form>
    <p id="error" role="alert"></p>
    <script>
      // `attachment` names the current attachment. Attach and Detach start a new one, and an
      // answer that arrives for an older one is dropped: otherwise a poll still waiting when the
      // user detaches would re-enable Send with a lease this view no longer holds, and attaching
      // again while one waits would start a second polling loop.
      let attachment = 0,
        lease = null,
        cursor = 0,
        timer;
      const element = (id) => document.getElementById(id);
      // `crypto.randomUUID` needs a secure context, which an opaque frame may not be.
      const uniqueId = () =>
        Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) =>
          b.toString(16).padStart(2, '0'),
        ).join('');
      function canSend(enabled) {
        element('message').disabled = element('send').disabled = !enabled;
      }
      function leave() {
        attachment += 1;
        clearTimeout(timer);
        lease = null;
        canSend(false);
      }
      const rpc = (method, params = {}) =>
        wtm.request('session', {
          backend: 'demo',
          request: { method, params: { session: 'demo-1', ...params } },
        });
      function render(update) {
        if (update.reset) {
          cursor = 0;
          element('transcript').textContent = '';
        }
        for (const event of update.events)
          if (event.seq > cursor) {
            element('transcript').textContent += event.text + '\n';
            cursor = event.seq;
          }
        lease = update.lease;
        canSend(!!lease);
      }
      async function act(fn) {
        try {
          element('error').textContent = '';
          await fn();
        } catch (e) {
          element('error').textContent = e.message;
        }
      }
      async function poll(current) {
        try {
          const update = await rpc('poll', { after: cursor });
          if (current !== attachment) return;
          render(update);
          timer = setTimeout(() => poll(current), 1000);
        } catch (e) {
          if (current !== attachment) return;
          leave();
          element('error').textContent = e.message;
        }
      }
      element('attach').onclick = () =>
        act(async () => {
          leave();
          const current = attachment;
          const update = await rpc('attach', { after: cursor });
          if (current !== attachment) return;
          render(update);
          element('control').disabled = element('detach').disabled = false;
          timer = setTimeout(() => poll(current), 1000);
        });
      element('control').onclick = () =>
        act(async () => {
          const current = attachment;
          const granted = (await rpc('control')).lease;
          if (current !== attachment) return;
          lease = granted;
          canSend(!!lease);
        });
      element('detach').onclick = () =>
        act(async () => {
          const held = lease;
          leave();
          element('control').disabled = element('detach').disabled = true;
          await rpc('detach', { lease: held });
        });
      element('settings').onclick = () => wtm.request('navigate', { target: 'settings' });
      element('input').onsubmit = (event) => {
        event.preventDefault();
        act(async () => {
          const text = element('message').value;
          if (!lease || !text.trim()) return;
          await rpc('input', { lease, text, input_id: uniqueId() });
          element('message').value = '';
        });
      };
    </script>
  </body>
</html>
