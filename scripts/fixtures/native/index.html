<!doctype html>
<html data-theme="dark" data-palette="pine">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #app > p {
        padding: 10px;
      }
      nav {
        display: flex;
        padding: 10px;
        gap: 10px;
      }
      .c-pane {
        min-height: 0;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const qa = (window.qa = { calls: [], callbacks: {}, listeners: {}, n: 0 });
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: (event, id) => {
          qa.listeners[event] = (qa.listeners[event] || []).filter((n) => n !== id);
        },
      };
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main' } },
        transformCallback: (fn) => {
          const id = ++qa.n;
          qa.callbacks[id] = fn;
          return id;
        },
        unregisterCallback: (id) => delete qa.callbacks[id],
        invoke: async (command, args = {}) => {
          qa.calls.push({ command, args });
          if (command === 'plugin:event|listen') {
            (qa.listeners[args.event] ??= []).push(args.handler);
            return ++qa.n;
          }
          if (
            command === 'plugin:event|unlisten' ||
            command === 'pty_resize' ||
            command === 'pty_write' ||
            command === 'focus_run_shell'
          )
            return;
          // The real restart closes the old process first. What Rust keeps of a native
          // conversation, its receipts above all, outlives it; see `qa.journal`.
          if (command === 'close_terminal') {
            const state = qa.native.states[args.session];
            if (state) qa.journal[state.conversation] = JSON.parse(JSON.stringify(state));
            return;
          }
          if (command === 'terminal_replay')
            return {
              through: 0,
              chunkBase64: btoa(
                'Native CLI UI fixture\r\n\r\nNo provider is running. Host responses are simulated for UI verification.\r\n',
              ),
            };
          if (command === 'open_native_cli') return qa.newNative(args);
          if (
            command === 'open_agent_session' ||
            command === 'open_terminal' ||
            command === 'open_plugin_terminal'
          )
            return `session-${++qa.n}`;
          if (command === 'agent_replay') return [];
          if (command === 'agent_capability') return { models: [], modes: [] };
          if (command === 'list_prototypes') return qa.launch ? [] : qa.reviews;
          if (command === 'plugin:menu|new') {
            qa.menu = args.options;
            return [++qa.n, 'fixture-menu'];
          }
          if (command === 'popup_native_menu') {
            const chosen = qa.menu.items.find((item) => item.text === qa.menuChoice);
            if (!chosen) throw Error('Missing menu entry ' + qa.menuChoice);
            chosen.handler.onmessage(chosen.id);
            return;
          }
          if (command === 'plugin:resources|close') return;
          if (command === 'native_session')
            return JSON.parse(JSON.stringify(qa.native.states[args.session]));
          // The delivery rules Rust enforces, so the UI is checked against refusals it can meet.
          if (command === 'implement_prototype') {
            const value = qa.native.states[args.session];
            const blocked = value.deliveries.some(
              (r) => !r.earlier && (r.status === 'pending' || r.status === 'unknown'),
            );
            if (value.status !== 'idle' || qa.review.stale || blocked)
              throw { kind: 'native', message: 'Not ready' };
            const receipt = {
              id: `receipt-${++qa.n}`,
              label: 'Implement reviewed design',
              status: value.capabilities.send ? 'delivered' : 'pending',
              prototype: 'prototype',
              review: args.reviewId,
              error: null,
              resolution: null,
              conversation: value.conversation,
              earlier: false,
            };
            qa.native.accept({
              ...value,
              seq: value.seq + 1,
              deliveries: [...value.deliveries, receipt],
            });
            // As Rust does: marked implemented once a live receipt exists, and announced.
            qa.publishReview({
              prototype: { ...qa.review.prototype, implementedReview: args.reviewId },
              delivery: {
                receipt: receipt.id,
                review: args.reviewId,
                status: receipt.status,
                error: null,
                resolution: null,
              },
            });
            return null;
          }
          if (command === 'check_native_delivery') {
            const value = qa.native.states[args.session];
            const uncertain = value.deliveries.some((r) => r.status === 'unknown');
            const connected = ['idle', 'working', 'needs_approval'].includes(value.status);
            const reason = !uncertain
              ? 'No delivery in this conversation is uncertain.'
              : value.provider !== 'codex'
                ? "wtm cannot read Claude's conversation history. Check the conversation yourself, and mark the instruction as not delivered if it never arrived."
                : !connected
                  ? 'Reconnect the native session before checking delivery.'
                  : "The provider's history does not show this instruction. Missing history does not prove it was not delivered, so it stays uncertain.";
            return {
              checked: uncertain && value.provider === 'codex' && connected,
              changed: false,
              reason,
              session: JSON.parse(JSON.stringify(value)),
            };
          }
          if (command === 'resolve_native_delivery') {
            const value = qa.native.states[args.session];
            const receipt = value.deliveries.find((r) => r.id === args.receipt);
            const from = args.resolution === 'not_delivered' ? 'unknown' : 'pending';
            if (!receipt || receipt.status !== from)
              throw {
                kind: 'native',
                message: 'Delivery has already changed; refresh before resolving it',
              };
            const resolved = {
              ...receipt,
              status: 'rejected',
              resolution: args.resolution,
              error: args.resolution === 'withdrawn' ? 'Withdrawn' : 'Marked not delivered',
            };
            qa.native.accept({
              ...value,
              seq: value.seq + 1,
              deliveries: value.deliveries.map((r) => (r.id === receipt.id ? resolved : r)),
            });
            // A rejected receipt leaves the design unimplemented, and Rust re-announces it.
            if (resolved.prototype)
              qa.publishReview({
                prototype: { ...qa.review.prototype, implementedReview: null },
                delivery: {
                  receipt: resolved.id,
                  review: resolved.review,
                  status: 'rejected',
                  error: resolved.error,
                  resolution: resolved.resolution,
                },
              });
            return resolved;
          }
          if (command === 'cancel_prototype')
            return {
              interrupted: false,
              notice:
                'Design cancelled. Stop the current turn in the native CLI if it is still working.',
            };
          if (command === 'interrupt_native_turn') {
            qa.update({ status: 'idle' });
            return;
          }
          // Opening the preview is what lets Implement through, and Rust announces it.
          if (command === 'open_prototype_preview') {
            qa.publishReview({
              prototype: {
                ...qa.review.prototype,
                review: { ...qa.review.prototype.review, opened: true },
              },
            });
            return null;
          }
          throw Error('Unexpected IPC ' + command);
        },
      };
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
