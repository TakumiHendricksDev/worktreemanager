[package]
name        = "wtm-app"
description = "Composition root and Tauri command surface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lib]
# Tauri's own convention: the app lives in a library so integration tests and the thin
# binary in `src/main.rs` can both use it.
name       = "wtm_app_lib"
# `rlib` alone. Tauri's template ships `["staticlib", "cdylib", "rlib"]` because those are
# what a mobile target links against — `staticlib` for iOS, `cdylib` for Android — and this
# app has neither: there is no `tauri::mobile_entry_point`, `src-tauri/gen` holds desktop
# schemas only, and `just icon` deletes the mobile icon trees rather than committing them.
#
# They were not free. Each is a full codegen of this crate plus an archive or link of the
# whole ~800-crate graph behind it, and because they hang off the last crate in the graph
# they land on the critical path with nothing else left to run in parallel. Measured on a
# cold release build: dropping them took it from 152s to 127s on its own, and the dead
# `libwtm_app_lib.a` they produced was 174 MB of `target/`. See ARCHITECTURE.md § Build
# performance.
crate-type = ["rlib"]

# The binary name must match `mainBinaryName` in tauri.conf.json, or bundling cannot
# find what it built. Without this it would default to the package name, `wtm-app`.
[[bin]]
name = "wtm"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The only crate that knows Tauri exists. Everything below it is framework-free.
#
# `unstable` is the child-webview API — `Window::add_child`, `Webview::set_bounds` — which is how
# the browser pane puts a second, real webview over a tile (see `browser.rs`). Tauri calls it
# unstable because the API may change between minor versions, not because it misbehaves; the
# version is pinned exactly in `Cargo.lock`, so a bump is a reviewed diff rather than a surprise.
tauri      = { version = "2", features = ["macos-private-api", "unstable"] }
# The native folder picker behind "Browse…" in Add a repository. The one capability this app
# grants beyond its own commands: it returns a path the user chose by hand, and nothing else —
# no directory listing, no read. That path is then validated by the same `git rev-parse` a
# typed one goes through, so the picker is a convenience over the text field, not a way around it.
tauri-plugin-dialog = "2"

# Notifications, for a session that needs an answer while the window is in the background — but
# only as the *fallback* poster. The primary path is `wtm-notify`, whose native center carries a
# navigation payload a click delivers back; this plugin covers the case that center cannot exist:
# an unbundled dev run, where `UNUserNotificationCenter` refuses a process with no bundle id.
# Its JS API is unused and its capability grants are gone — the webview reaches notifications
# only through this app's own `post_notification` command.
#
# A dependency rather than four lines of DOM because the webview's own `Notification` API does not
# exist in WKWebView, which is the engine every Mac build runs on.
tauri-plugin-notification = "2"
wtm-core   = { workspace = true }
wtm-notify = { workspace = true }
# The browser pane's native half: isolated-world scripts, message handlers, evaluation and
# snapshots, which Tauri does not expose. Fenced FFI like `wtm-notify`; see its Cargo.toml header.
wtm-webview = { workspace = true }
wtm-config = { workspace = true }
wtm-exec   = { workspace = true }
wtm-agent  = { workspace = true }
wtm-dictate = { workspace = true }
wtm-db      = { workspace = true }
wtm-git    = { workspace = true }
wtm-render = { workspace = true }
parking_lot = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# Handoff tokens. A v4 is the right shape here: the token identifies which session's MCP bridge is
# calling, so it must be unguessable by anything that did not receive it in its environment.
uuid       = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wtm-testkit = { workspace = true }
tempfile    = { workspace = true }
# Only to assert things about our own Cargo.toml — see `the_release_profile_does_not_abort_on_panic`.
toml        = { workspace = true }
