[package]
name        = "wtm-app"
description = "Composition root and Tauri command surface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lib]
# Tauri's own convention: the app lives in a library so integration tests and the
# (future) mobile entry point can both use it, with a thin binary on top.
name       = "wtm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary name must match `mainBinaryName` in tauri.conf.json, or bundling cannot
# find what it built. Without this it would default to the package name, `wtm-app`.
[[bin]]
name = "wtm"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The only crate that knows Tauri exists. Everything below it is framework-free.
tauri      = { version = "2", features = ["macos-private-api"] }
# The native folder picker behind "Browse…" in Add a repository. The one capability this app
# grants beyond its own commands: it returns a path the user chose by hand, and nothing else —
# no directory listing, no read. That path is then validated by the same `git rev-parse` a
# typed one goes through, so the picker is a convenience over the text field, not a way around it.
tauri-plugin-dialog = "2"
wtm-core   = { workspace = true }
wtm-config = { workspace = true }
wtm-exec   = { workspace = true }
wtm-agent  = { workspace = true }
wtm-git    = { workspace = true }
wtm-render = { workspace = true }
parking_lot = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# Handoff tokens. A v4 is the right shape here: the token identifies which session's MCP bridge is
# calling, so it must be unguessable by anything that did not receive it in its environment.
uuid       = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wtm-testkit = { workspace = true }
tempfile    = { workspace = true }
# Only to assert things about our own Cargo.toml — see `the_release_profile_does_not_abort_on_panic`.
toml        = { workspace = true }
