[package]
name = "wtm-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# No `wtm-exec`, for the reason `wtm-dictate` has none: this crate builds argv, a script and parsers,
# and cannot spawn anything. The composition root runs the commands.
#
# No HTTP client either. The update check is `curl`, like the transcription request, and for the
# same licence and trust-store reasons — see `wtm-dictate`'s module docs.
[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }

