# ─────────────────────────────────────────────────────────────────────────────
# The one crate that cannot take `[lints] workspace = true`.
#
# The workspace forbids `unsafe_code`, and `forbid` cannot be overridden at a
# use site. This crate exists precisely to fence the objc2 FFI the rest of the
# workspace is forbidden from writing: posting a macOS notification that
# navigates on click needs UNUserNotificationCenter and a delegate, and there
# is no safe wrapper this repo can accept — `user-notify` is LGPL, which
# deny.toml rejects, and it drags in `async-trait`, which ARCHITECTURE §3
# deliberately avoids. So: the workspace lints table, verbatim, with one change
# — `unsafe_code = "deny"` — and the unsafe lives in one module (`mac.rs`)
# under a written justification.
# ─────────────────────────────────────────────────────────────────────────────
[package]
name = "wtm-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }
block2 = { workspace = true }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# pedantic opt-outs — the workspace's own, kept in lockstep with the root table
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
