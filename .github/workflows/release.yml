name: Release

# Tag-triggered, because a release is a deliberate act. `just check` and the CI
# matrix already gate every push; this only packages what those proved.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in tauri.conf.json — `verify version` below fails
# the run if it does not, before anything is built or published.
on:
  push:
    tags: ['v*']

# The workflow creates a Release, which needs write access to the repo's contents.
# Nothing else does, so nothing else is granted.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # One job, not a build/publish pair.
  #
  # The split existed to fan two platforms' artifacts into one release, and the
  # `publish` half deliberately had no checkout because it only needed what the
  # builds uploaded. With macOS the only target there is nothing to fan in: the
  # split would buy a second runner spin-up and an upload/download round trip of
  # the very zip this job just made, and buy no permission boundary either —
  # `contents: write` is granted at the workflow level above.
  release:
    name: build and draft macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      # Tauri signs, notarizes and staples in one step when these are set: it imports the
      # certificate into a throwaway keychain, signs with the hardened runtime and
      # `src-tauri/Entitlements.plist`, submits to Apple's notary service, waits, and
      # staples the ticket into the .app — so the zip below carries it.
      #
      # The API key reaches Tauri as a file because `notarytool` will only read one from a
      # path. `RUNNER_TEMP` is emptied at the end of every job.
      #
      # `APPLE_TEAM_ID` is deliberately not passed here. Tauri reads it only for the
      # Apple-ID route to notarization, and offering both routes makes which one it took a
      # question rather than a fact.
      - name: Build, sign and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_KEY_P8
          bun x tauri build --bundles app

      # Without a signing identity, or without notarization credentials, Tauri still exits 0:
      # it prints "skipping signing" or "skipping app notarization", carries on, and hands back
      # an app that macOS calls "damaged". So the outcome is checked here rather than trusted,
      # before anything is published. `just release` checks the downloaded zip again, because
      # a check that only runs where it was built proves nothing about what was uploaded.
      #
      # The entitlement gets its own check because losing it fails silently. Nothing breaks
      # at launch: macOS just denies the microphone without a prompt, and dictation records
      # silence.
      #
      # No `spctl` here. Gatekeeper's verdict is only worth asking for on a machine where
      # Gatekeeper is known to be on, so `just release` asks it on the releasing Mac.
      # `stapler validate` is what proves notarization, and it does not depend on that.
      - name: Verify the signature and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="target/release/bundle/macos/Worktree Manager.app"
          codesign --verify --strict --deep --verbose=2 "$app"
          team="$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [ "$team" != "$APPLE_TEAM_ID" ]; then
            echo "::error::the app is signed by team '$team', not the Developer ID team"
            exit 1
          fi
          codesign -d --entitlements - --xml "$app" 2>/dev/null \
            | grep -q 'com.apple.security.device.audio-input' || {
              echo "::error::the signed app lost its microphone entitlement"
              exit 1
            }
          xcrun stapler validate "$app"

      # `ditto`, not `zip`: a .app is a bundle with symlinks and extended attributes,
      # and plain `zip -r` quietly mangles them into something that will not launch.
      # `--keepParent` puts `Worktree Manager.app` at the archive root, which is what
      # the Homebrew cask's `app` stanza expects to find.
      - name: Package
        run: |
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/macos/Worktree Manager.app" \
            "dist-release/wtm-${{ env.version }}-macos-arm64.zip"

      # Written outside the directory and moved back in, not `tee`d into it: the
      # glob and the redirection race, and a checksum file that lists itself is
      # one that can never verify.
      - name: Checksums
        shell: bash
        run: |
          cd dist-release
          shasum -a 256 * | tee "../checksums-macos-arm64.txt"
          mv "../checksums-macos-arm64.txt" .

      # A draft, deliberately. The Homebrew cask needs the published sha256 before
      # anyone can install, so `just release` verifies the artifact, updates the tap,
      # and only then publishes.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "brew install --cask takumihendricksdev/tap/wtm"
            echo '```'
            echo
            echo 'Requires macOS 13+ on Apple silicon.'
            echo
            echo 'Signed with a Developer ID and notarized by Apple, so the zip below'
            echo 'opens like any other download too: unzip it and move the app to'
            echo 'Applications.'
            echo
            echo '### Checksums'
            echo
            echo '```'
            cat checksums-macos-arm64.txt
            echo '```'
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            wtm-*.zip checksums-macos-arm64.txt
