name: Release

# Tag-triggered, because a release is a deliberate act. `just check` and the CI
# matrix already gate every push; this only packages what those proved.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in tauri.conf.json — `verify version` below fails
# the run if it does not, before anything is built or published.
on:
  push:
    tags: ['v*']

# The workflow creates a Release, which needs write access to the repo's contents.
# Nothing else does, so nothing else is granted.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # One job, not a build/publish pair.
  #
  # The split existed to fan two platforms' artifacts into one release, and the
  # `publish` half deliberately had no checkout because it only needed what the
  # builds uploaded. With macOS the only target there is nothing to fan in: the
  # split would buy a second runner spin-up and an upload/download round trip of
  # the very zip this job just made, and buy no permission boundary either —
  # `contents: write` is granted at the workflow level above.
  release:
    name: build and draft macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile

      - name: Build
        run: bun x tauri build --bundles app

      # `ditto`, not `zip`: a .app is a bundle with symlinks and extended attributes,
      # and plain `zip -r` quietly mangles them into something that will not launch.
      # `--keepParent` puts `Worktree Manager.app` at the archive root, which is what
      # the Homebrew cask's `app` stanza expects to find.
      - name: Package
        run: |
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/macos/Worktree Manager.app" \
            "dist-release/wtm-${{ env.version }}-macos-arm64.zip"

      # Written outside the directory and moved back in, not `tee`d into it: the
      # glob and the redirection race, and a checksum file that lists itself is
      # one that can never verify.
      - name: Checksums
        shell: bash
        run: |
          cd dist-release
          shasum -a 256 * | tee "../checksums-macos-arm64.txt"
          mv "../checksums-macos-arm64.txt" .

      # A draft, deliberately. The macOS build is unsigned, so the release notes
      # carry install instructions that have to be right — and the Homebrew cask
      # needs the published sha256 before anyone can install. `just release`
      # verifies the artifact, updates the tap, and publishes.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "brew install --cask takumihendricksdev/tap/wtm"
            echo '```'
            echo
            echo 'Requires macOS 13+ on Apple silicon.'
            echo
            echo 'The app is unsigned, so macOS would otherwise refuse to open it and'
            echo 'report it as "damaged". The cask clears the quarantine attribute after'
            echo 'installing — a deliberate Gatekeeper bypass, documented in the tap.'
            echo
            echo 'Or download the zip below. Fetch it with `curl`/`gh` rather than a'
            echo 'browser: browsers set the quarantine attribute, the CLI does not.'
            echo
            echo '### Checksums'
            echo
            echo '```'
            cat checksums-macos-arm64.txt
            echo '```'
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            wtm-*.zip checksums-macos-arm64.txt
