name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref. Don't pay for results
# nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts are reused between CI runs, so building them is
  # pure cost.
  CARGO_INCREMENTAL: 0
  # Deliberately no `RUSTFLAGS: -D warnings` here.
  #
  # It would be redundant. `cargo clippy … -- -D warnings` below already denies both
  # clippy and rustc lints across every target of exactly our crates, and cargo passes
  # `--cap-lints allow` to registry dependencies *after* command-line lint levels, so a
  # warning inside a dependency could never fail the build regardless. Macro-expanded
  # code is not capped — `tauri::generate_context!` expands a great deal of
  # Tauri-authored code into `wtm-app` — but the `app` job below compiles exactly that
  # expansion in the release profile, which is where it would surface.
  #
  # Keeping the flag on the clippy invocation rather than in the environment also keeps
  # this workflow, `.cargo/config.toml`'s `lint` alias, the justfile and bacon.toml
  # saying the same thing without four edits.

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint and test the whole workspace on the platform the app actually ships to.
  #
  # This used to run on ubuntu, which is ~10x cheaper per minute — a real saving
  # when the repo shipped a Linux build and that leg had to be proved anyway. It
  # does not any more, and running it on Linux would mean keeping `wtm-app`
  # compiling against WebKitGTK for the sake of the runner rather than for the
  # sake of a user — a bill that came due as recently as 87490b1, "Fix Linux
  # compilation of the browser native bridge". This repo is public, so macOS
  # minutes are free; the move costs a weaker runner and buys every gate running
  # against the toolchain that actually ships.
  # ───────────────────────────────────────────────────────────────────────────
  rust:
    name: rust (workspace)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        # rust-toolchain.toml is authoritative; rustup reads it.
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - run: cargo nextest run --workspace

      # The architectural guard: wtm-core must have no OS-specific dependency.
      # If an adapter concern leaks into the domain, this is what catches it.
      - name: wtm-core is OS-agnostic
        run: cargo check -p wtm-core --target wasm32-unknown-unknown

  # Stays on ubuntu: it compiles no Rust, so the runner's OS is invisible to it
  # and the cheap one is the right one.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Exactly the globs `just fmt-check` uses. They had drifted: CI omitted
      # `src-tauri/runtime/*.js`, so a badly formatted runtime script was green here
      # and red under `just check`. Two lists that must agree should be one list;
      # until they are, they at least get changed together.
      - run: bun x prettier --check "src/**/*.{ts,svelte,css,scss}" "src-tauri/runtime/*.js" "*.json"
      - run: bun run check

  # ───────────────────────────────────────────────────────────────────────────
  # Prove the app actually links and bundles.
  #
  # Separate from `rust` rather than appended to it: the two use different cargo
  # profiles and so share no artifacts, and as separate jobs they run at the same
  # time instead of one after the other.
  #
  # `name:` is set explicitly to keep the check name stable for anyone with a
  # branch rule on it.
  # ───────────────────────────────────────────────────────────────────────────
  app:
    name: build .app (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
      - run: rustup show active-toolchain

      # Restore but do not save on PRs. A release-profile Tauri tree is ~2 GB
      # against a 10 GB per-repo budget, and thrashing that evicts the `rust`
      # job's cache — which is the one people wait on.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: bun install --frozen-lockfile

      - run: bun x tauri build --bundles app

  supply-chain:
    name: licenses + advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
